# meute — fleet manifest
#
# The runner reads this file, flattens it into a work queue, and executes ONE
# item per invocation. Order is structural: everything under `repos:` is
# considered before anything under `community:`.
#
# Validate after editing:   ./bin/run.sh --validate
# Dry-run the selection:    ./bin/run.sh daily --dry-run

version: 1

# ---------------------------------------------------------------------------
# Fleet-wide defaults. Any repo entry or task entry may override these.
# Precedence: task > repo/project > defaults.
# ---------------------------------------------------------------------------
defaults:
  engine: claude          # claude | codex  (CLI --engine overrides this)
  model: sonnet           # alias or full model id; sonnet is the cost/quality default
  file_budget: 25         # max files a task may open; injected into every prompt
  timeout_seconds: 1800   # hard wall-clock kill for a single engine invocation

# ---------------------------------------------------------------------------
# Scheduling policy.
# ---------------------------------------------------------------------------
policy:
  quota_floor_percent: 30   # below this much remaining weekly quota, the runner exits 0
  community_share: 0.20     # max share of this ISO week's runs spent on the community track
  tier3_max_in_flight: 3    # max undelivered tier-3 draft branches across the whole fleet

  # A ceiling on meute's OWN weekly consumption, computed from state/log. Set one
  # or the other, never both. With either set, the runner wires
  # contrib/quota-self-budget.sh automatically — no env vars needed in cron — and
  # the declared number is the stop point (quota_floor_percent does not apply to
  # it, since a self-budget is already meute's allocation and reserving headroom
  # inside it would double-count).
  #
  # Prefer cost over runs: task cost varies about 7x, from ~$0.15 for a lint
  # sweep to ~$2.50 for a tier-3 fix on opus, so a run count is a poor ceiling.
  # These are list-price equivalents of work the subscription already paid for —
  # a measure of effort, not money owed.
  #
  # weekly_cost_usd: 10.00
  # weekly_runs: 20
  branch_prefix: meute      # scratch branches are <prefix>/<task>-<date>

# ---------------------------------------------------------------------------
# Commands a write tier may run without an approver present.
#
# This exists because `acceptEdits` auto-approves *edits* but still denies
# arbitrary shell execution — so without an allowlist a "self-verifying" tier
# cannot run the suite it just wrote, and reports itself unverified.
#
# Read this as a blast-radius reducer, NOT a sandbox: `pytest` happily executes
# test code the agent wrote seconds ago. What the list does buy you is that an
# unattended run cannot reach the network, install packages, push a branch, or
# write outside its worktree. Interpreters (`python3 -c`, `node -e`, `bash -c`)
# are deliberately absent — pre-approving one is equivalent to full execution.
# Add them per-repo only if you accept that.
# ---------------------------------------------------------------------------
verify_commands: &verify_commands >-
  Bash(pytest:*) Bash(python3 -m pytest:*) Bash(python -m pytest:*)
  Bash(npm test:*) Bash(npm run test:*) Bash(npm run lint:*) Bash(pnpm test:*)
  Bash(yarn test:*) Bash(npx vitest:*) Bash(npx jest:*)
  Bash(cargo test:*) Bash(cargo clippy:*) Bash(cargo fmt:*)
  Bash(go test:*) Bash(go vet:*) Bash(gofmt:*)
  Bash(./gradlew test:*) Bash(./gradlew lint:*)
  Bash(make test:*) Bash(make lint:*)
  Bash(ruff:*) Bash(eslint:*) Bash(prettier:*) Bash(black:*)
  Bash(rustfmt:*) Bash(ktlint:*) Bash(shfmt:*) Bash(pre-commit run:*)
  Bash(git status:*) Bash(git diff:*) Bash(git log:*) Bash(ls:*) Bash(cat:*)

# Read-only GitHub access for the community track. Deliberately excludes bare
# `gh` and `gh api` -- `gh api` can POST, and the community track's hardest rule
# is that nothing it does reaches the project. Verified: the permission layer
# parses compound commands, so an allowlisted prefix cannot smuggle a chained
# `gh pr create` past the gate.
gh_read_commands: &gh_read >-
  Bash(gh issue list:*) Bash(gh issue view:*) Bash(gh pr list:*)
  Bash(gh pr view:*) Bash(gh label list:*) Bash(gh search issues:*)
  Bash(gh repo view:*) Bash(git log:*) Bash(ls:*) Bash(cat:*)

# Verify commands plus read-only gh, for the stages that both build and read issues.
verify_and_gh: &verify_and_gh >-
  Bash(pytest:*) Bash(python3 -m pytest:*) Bash(python -m pytest:*)
  Bash(npm test:*) Bash(npm run test:*) Bash(npm ci:*) Bash(npm install:*)
  Bash(cargo test:*) Bash(cargo build:*) Bash(go test:*) Bash(make test:*)
  Bash(./gradlew test:*) Bash(pip install:*) Bash(ruff:*) Bash(eslint:*)
  Bash(gh issue view:*) Bash(gh issue list:*) Bash(gh pr list:*)
  Bash(git status:*) Bash(git diff:*) Bash(git log:*) Bash(ls:*) Bash(cat:*)

# Dependency scanners. Read-only by construction: each of these reports, and
# none of them writes a lockfile. Deliberately excludes `npm install`,
# `pip install`, `cargo update` and friends -- an unattended upgrade is how a
# working build stops working overnight.
audit_commands: &audit_commands >-
  Bash(npm audit:*) Bash(npm outdated:*) Bash(npm ls:*)
  Bash(pnpm audit:*) Bash(yarn audit:*)
  Bash(pip-audit:*) Bash(pip list:*) Bash(pip index:*)
  Bash(cargo audit:*) Bash(cargo outdated:*) Bash(cargo tree:*)
  Bash(go list:*) Bash(govulncheck:*)
  Bash(osv-scanner:*) Bash(grype:*)
  Bash(git log:*) Bash(ls:*) Bash(cat:*)

# ---------------------------------------------------------------------------
# Tiers define the blast radius of a task: which tools exist at all, whether the
# engine may accept its own edits, and whether the scratch branch is committed.
# `tools` is a hard availability filter, not a permission prompt — a tier
# without Write/Edit/Bash physically cannot modify the worktree.
# ---------------------------------------------------------------------------
tiers:
  tier1:
    description: Autonomous and self-verifying. Commits to a scratch branch.
    tools: "Read,Grep,Glob,Edit,Write,Bash,TodoWrite"
    permission_mode: acceptEdits
    allowed_tools: *verify_commands
    writes_code: true
  tier2:
    description: Autonomous reports for async reading. Never touches the repo.
    tools: "Read,Grep,Glob"
    permission_mode: dontAsk
    writes_code: false
  tier2-web:
    description: >-
      Autonomous reports for async reading. Same as tier2, plus the public
      web via WebSearch/WebFetch. No Bash: WebSearch/WebFetch results are
      untrusted third-party content, and this tier cannot act on them beyond
      writing them into a report a human reads later -- it cannot shell out
      on the strength of something a fetched page said.
    tools: "Read,Grep,Glob,WebSearch,WebFetch"
    permission_mode: dontAsk
    writes_code: false
  tier2-scout:
    description: Reads GitHub through gh. Never modifies a repo, never writes to a project.
    tools: "Read,Grep,Glob,Bash"
    permission_mode: dontAsk
    allowed_tools: *gh_read
    writes_code: false
  tier3:
    description: Drafts behind a human gate. Specced tickets only, capped in flight.
    tools: "Read,Grep,Glob,Edit,Write,Bash,TodoWrite"
    permission_mode: acceptEdits
    allowed_tools: *verify_commands
    writes_code: true

# ---------------------------------------------------------------------------
# Task registry. `template` is resolved relative to this file.
# A task is only scheduled in the slots it lists.
# ---------------------------------------------------------------------------
tasks:
  gen-tests:
    tier: tier1
    template: tasks/gen-tests.md
    slots: [weekly]

  audit-security:
    tier: tier2
    template: tasks/audit-security.md
    slots: [daily, weekly]
    model: opus            # narrow lens, high stakes — worth the better model
    # One lens per run, rotated per (repo, task) via state/cursor. Keeping the
    # lens narrow is what makes the finding density worth reading.
    lenses: [auth, input-parsing, injection, dependency-risk]

  architecture-review:
    tier: tier2
    template: tasks/architecture-review.md
    slots: [weekly]        # structural drift moves slowly; daily would be noise
    model: opus            # same reasoning as audit-security: narrow, high stakes
    lenses: [coupling, layering, duplication, boundaries]

  market-comparison:
    tier: tier2-web         # the only task that needs the public web
    template: tasks/market-comparison.md
    slots: [weekly]        # the market doesn't move daily either
    model: opus            # same reasoning as the other tier-2 reports
    lenses: [direct-alternatives, feature-gap, approach-divergence]

  # Tier 3. Only touches tickets marked `specced: true` — either hand-written
  # below, or promoted from a report by `meute promote`. Capped in flight by
  # policy.tier3_max_in_flight.
  draft-ticket:
    tier: tier3
    template: tasks/draft-ticket.md
    slots: [weekly]
    requires_specced_ticket: true
    model: opus            # changing production code unattended — use the best model

  # ---- tier 1: self-verifying maintenance --------------------------------
  lint-sweep:
    tier: tier1
    template: tasks/lint-sweep.md
    slots: [daily]

  doc-regen:
    tier: tier1
    template: tasks/doc-regen.md
    slots: [weekly]

  # Writes nothing; it needs tier 1 only because it must RUN the scanners, which
  # tier 2 has no Bash for. Its empty scratch branch is deleted automatically.
  dep-audit:
    tier: tier1
    template: tasks/dep-audit.md
    slots: [weekly]
    allowed_tools: *audit_commands

  conventions:
    tier: tier1
    template: tasks/conventions.md
    slots: [weekly]

  # ---- community track: scout -> reproduce -> [human gate] -> draft --------
  # Each stage refuses to run on work the previous stage did not clear.
  scout:
    tier: tier2-scout
    template: tasks/scout.md
    slots: [weekly]

  # Candidates only: tickets that exist but are NOT yet specced: true.
  reproduce:
    tier: tier1
    template: tasks/reproduce.md
    slots: [weekly]
    requires_candidate_ticket: true
    allowed_tools: *verify_and_gh

  # Specced tickets only. A human flips specced: true after reading the
  # reproduce report -- contributing to someone else's project is never automatic.
  draft:
    tier: tier3
    template: tasks/draft.md
    slots: [weekly]
    requires_specced_ticket: true
    model: opus
    allowed_tools: *verify_and_gh

  # ---- phase 2 ------------------------------------------------------------
  # architecture-review and market-comparison are built above. "feature
  # brainstorm" is deliberately not: unlike every other task here, free-form
  # brainstorming has no falsifiability anchor (nothing to point at that
  # confirms or refutes an idea), which conflicts with this fleet's own rule
  # that inventing a finding is worse than finding none. See docs/prp/PRP-001-meute.md §11.

# ---------------------------------------------------------------------------
# My repos. First claim on every slot.
# Uncomment and fill in real paths — the fleet is inert until you do.
# ---------------------------------------------------------------------------
repos: []

